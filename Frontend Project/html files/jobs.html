<section class="section">
    <h2>Find Jobs</h2>

    <input type="text" id="jobSearch" placeholder="Search jobs..." style="padding:10px;width:100%;max-width:400px;margin:auto;display:block;border-radius:8px;border:1px solid #ccc;">

    <div class="grid" id="jobList">

        <div class="job-card">
            <h3>Java Developer</h3>
            <p>TCS - Chennai</p>
            <span>₹4-6 LPA</span>
            <button>Apply</button>
        </div>

        <div class="job-card">
            <h3>Frontend Developer</h3>
            <p>Infosys - Bangalore</p>
            <span>₹5-8 LPA</span>
            <button>Apply</button>
        </div>

        <div class="job-card">
            <h3>Backend Developer</h3>
            <p>Wipro - Hyderabad</p>
            <span>₹6-10 LPA</span>
            <button>Apply</button>
        </div>

    </div>
